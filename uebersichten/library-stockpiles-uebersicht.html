  main{padding:16px 20px;max-width:1100px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 12px;overflow:hidden}

  .fname{font-weight:600;font-size:15px;word-break:break-word}

  .arrow{color:var(--mut);transition:transform .12s;font-size:12px}
  .card.open .arrow{transform:rotate(90deg)}
  .cbody{display:none;border-top:1px solid var(--line);padding:10px 14px 12px}
  .card.open .cbody{display:block}
  .summ{color:var(--hi);font-size:13px;margin:0 0 10px}
  .catname{font-weight:600;font-size:13.5px;margin:10px 0 4px;color:var(--accent)}
  .fieldrow{margin:2px 0 6px}
  .fieldlbl{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.03em;margin-right:6px}
  .pill{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:5px;
        padding:1px 7px;margin:1px 3px 1px 0;font-size:12px}
  .flag{color:var(--hi);font-weight:600;font-size:12.5px;margin-right:10px}
  .empty{color:var(--mut);font-style:italic;font-size:13px}
  .nores{color:var(--mut);padding:30px;text-align:center}

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function renderCat(name, cat){
  let h = '<div class="catname">' + esc(name) + '</div>';
  const flags = [];
  for (const [k,v] of Object.entries(cat)){
    if (typeof v === 'boolean' && v) flags.push(k);
    if (typeof v === 'number') flags.push(k + '=' + v);
  }
  if (flags.length) h += '<div class="fieldrow">' + flags.map(f => '<span class="flag">&#10003; ' + esc(f) + '</span>').join('') + '</div>';
  for (const [k,v] of Object.entries(cat)){
    if (!Array.isArray(v) || !v.length) continue;
    h += '<div class="fieldrow"><span class="fieldlbl">' + esc(k) + ' (' + v.length + ')</span>'
       + v.map(x => '<span class="pill">' + esc(x) + '</span>').join('') + '</div>';
  }
  if (!flags.length && !Object.values(cat).some(v => Array.isArray(v) && v.length))
    h += '<div class="empty">Kategorie aktiviert, aber nichts angehakt</div>';
  return h;
}

function renderBody(e){
  let h = '<div class="summ">' + esc(e.summary) + '</div>';
  const gen = Object.entries(e.general || {});
  if (gen.length){
    h += '<div class="catname">Allgemeine Einstellungen</div><div class="fieldrow">'
       + gen.map(([k,v]) => '<span class="flag">' + esc(k) + ' = ' + esc(v) + '</span>').join('') + '</div>';
  }
  const cats = Object.entries(e.cats || {});
  if (!cats.length && !gen.length) h += '<div class="empty">leer</div>';
  for (const [k,v] of cats) h += renderCat(k, v);
  if (e.unbekannt) h += '<div class="catname">Unbekannte Felder</div><div class="fieldrow">' + esc(JSON.stringify(e.unbekannt)) + '</div>';
  return h;
}

const list = document.getElementById('list');
const cards = DATA.map((e, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  const cats = Object.keys(e.cats || {});
  const badge = cats.length ? cats.join(', ') : 'leer';
  card.innerHTML = '<div class="chead"><span class="arrow">&#9654;</span>'
    + '<span class="fname">' + esc(e.name) + '</span>'
    + '<span class="badge">' + esc(badge) + '</span></div>'
    + '<div class="cbody"></div>';
  card.querySelector('.chead').addEventListener('click', () => {
    if (!card.classList.contains('open') && !card.dataset.rendered){
      card.querySelector('.cbody').innerHTML = renderBody(e);
      card.dataset.rendered = '1';
    }
    card.classList.toggle('open');
  });
  card.dataset.hay = (e.name + ' ' + JSON.stringify(e)).toLowerCase();
  list.appendChild(card);
  return card;
});

const stat = document.getElementById('stat');
function filter(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  let vis = 0;
  cards.forEach(c => {
    const show = !q || c.dataset.hay.includes(q);
    c.style.display = show ? '' : 'none';
    if (show) vis++;
  });
  stat.textContent = vis + ' von ' + DATA.length + ' Dateien';
  let nores = document.getElementById('nores');
  if (!vis){
    if (!nores){
      nores = document.createElement('div');
      nores.id = 'nores'; nores.className = 'nores';
      nores.textContent = 'Nichts gefunden.';
      list.appendChild(nores);
    }
  } else if (nores) nores.remove();
}
document.getElementById('q').addEventListener('input', filter);
document.getElementById('expandAll').addEventListener('click', () => cards.forEach(c => {
  if (c.style.display === 'none') return;
  if (!c.dataset.rendered){
    const e = DATA[cards.indexOf(c)];
    c.querySelector('.cbody').innerHTML = renderBody(e);
    c.dataset.rendered = '1';
  }
  c.classList.add('open');
}));
document.getElementById('collapseAll').addEventListener('click', () => cards.forEach(c => c.classList.remove('open')));
filter();
</script>
