<style>

  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;z-index:10;background:var(--bg);
         border-bottom:1px solid var(--line);padding:14px 20px}
  h1{margin:0 0 8px;font-size:19px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:10px}
  #q{width:100%;padding:11px 14px;font-size:16px;border:1px solid var(--line);
     border-radius:8px;background:var(--card2);color:var(--ink)}
  #q:focus{outline:2px solid var(--accent);border-color:var(--accent)}
  .meta{color:var(--mut);font-size:13px;margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
  .meta a{color:var(--accent);cursor:pointer;text-decoration:none}
  main{padding:16px 20px;max-width:1100px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 12px;overflow:hidden}
  .chead{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none}
  .chead:hover{background:var(--card2)}
  .fname{font-weight:600;font-size:15px;word-break:break-word}
  .badge{margin-left:auto;background:var(--card2);color:var(--mut);border:1px solid var(--line);
          border-radius:20px;padding:2px 10px;font-size:12px;white-space:nowrap}
  .arrow{color:var(--mut);transition:transform .12s;font-size:12px}
  .card.open .arrow{transform:rotate(90deg)}
  .cbody{display:none;border-top:1px solid var(--line);padding:6px 14px 12px}
  .card.open .cbody{display:block}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  tr:last-child td{border-bottom:none}
  .job{font-weight:600}
  .raw{color:var(--mut);font-size:12px}
  .pill{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:5px;
        padding:1px 7px;margin:1px 3px 1px 0;font-size:12px}
  .cond{display:block;margin:2px 0;font-size:12.5px}
  .op{color:var(--hi);font-weight:600}
  .empty{color:var(--mut);font-style:italic}
  .nores{color:var(--mut);padding:30px;text-align:center}
</style>

erial": "GLASS_GREEN", "value": 4}, {"condition": "AtLeast", "flags": ["sand_bearing"], "value": 10}, {"condition": "GreaterThan", "item_type": "BAR", "material": "COAL", "value": 100}], "job": "MakeWindow", "material": "GLASS_GREEN"}]}];
const list = document.getElementById('list');
const q = document.getElementById('q');
const stat = document.getElementById('stat');

const OP = {LessThan:'&lt;', GreaterThan:'&gt;', AtLeast:'&ge;', AtMost:'&le;',
            Equals:'=', NotEqual:'&ne;'};

function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function spaceCase(s){return String(s||'').replace(/([a-z])([A-Z])/g,'$1 $2');}

DATA.forEach(f=>{
  let parts=[f.name];
  f.orders.forEach(o=>{
    parts.push(o.job, spaceCase(o.job), o.item_subtype, o.material, o.reaction);
    (o.material_category||[]).forEach(m=>parts.push(m));
    (o.item_conditions||[]).forEach(c=>{
      parts.push(c.item_type, c.item_subtype, c.material, c.tool, c.reaction_class, c.reaction_id);
      (c.flags||[]).forEach(x=>parts.push(x));
    });
  });
  f._text = parts.filter(Boolean).join(' ').toLowerCase();
});

function condHtml(c){
  let subj = c.item_type || c.tool || '?';
  let q2 = [];
  if(c.material) q2.push(c.material);
  if(c.item_subtype) q2.push(c.item_subtype);
  if(c.reaction_class) q2.push('class:'+c.reaction_class);
  if(c.flags && c.flags.length) q2.push(c.flags.join(','));
  let q2s = q2.length ? '('+esc(q2.join(' / '))+')' : '';
  let op = OP[c.condition]||esc(c.condition);
  return '<span class="cond">&bull; '+esc(subj)+q2s+' <span class="op">'+op+'</span> '+esc(c.value)+'</span>';
}

function orderRows(o){
  let mats=[];
  if(o.material) mats.push(o.material);
  (o.material_category||[]).forEach(m=>mats.push(m));
  if(o.item_subtype) mats.push(o.item_subtype);
  let matHtml = mats.length ? mats.map(m=>'<span class="pill">'+esc(m)+'</span>').join('') : '<span class="empty">&ndash;</span>';
  let conds = (o.item_conditions||[]);
  let condStr = conds.length ? conds.map(condHtml).join('') : '<span class="empty">keine</span>';
  let job = o.reaction ? esc(o.reaction) : esc(spaceCase(o.job));
  let rawJob = (o.job && o.job!==job) ? '<div class="raw">'+esc(o.job)+'</div>' : '';
  return '<tr><td class="job">'+job+rawJob+'</td><td>'+matHtml+'</td><td>'+esc(o.frequency)+'</td><td>'+esc(o.amount_total)+'</td><td>'+condStr+'</td></tr>';
}

function cardHtml(f){
  let rows = f.orders.length
    ? '<table><thead><tr><th>Auftrag</th><th>Material/Typ</th><th>Frequenz</th><th>Menge</th><th>Bedingungen (wann gefertigt)</th></tr></thead><tbody>'+f.orders.map(orderRows).join('')+'</tbody></table>'
    : '<div class="empty" style="padding:8px 0">leere Liste</div>';
  return '<div class="card" data-name="'+esc(f.name.toLowerCase())+'">'
    +'<div class="chead"><span class="arrow">&#9654;</span><span class="fname">'+esc(f.name)+'</span>'
    +'<span class="badge">'+f.orders.length+' Auftr'+(f.orders.length===1?'ag':'aege')+'</span></div>'
    +'<div class="cbody">'+rows+'</div></div>';
}

list.innerHTML = DATA.map(cardHtml).join('');

list.addEventListener('click', e=>{
  let h=e.target.closest('.chead'); if(!h) return;
  h.parentElement.classList.toggle('open');
});
document.getElementById('expandAll').onclick=()=>document.querySelectorAll('.card:not([hidden])').forEach(c=>c.classList.add('open'));
document.getElementById('collapseAll').onclick=()=>document.querySelectorAll('.card').forEach(c=>c.classList.remove('open'));

function update(){
  let term = q.value.trim().toLowerCase();
  let shown=0;
  DATA.forEach((f,i)=>{
    let card = list.children[i];
    let hit = !term || f._text.includes(term);
    card.hidden = !hit;
    if(hit){ shown++; if(term) card.classList.add('open'); else card.classList.remove('open'); }
  });
  stat.textContent = term ? (shown+' von '+DATA.length+' Listen passen')
    : (DATA.length+' Listen, '+DATA.reduce((a,f)=>a+f.orders.length,0)+' Auftraege gesamt');
  let nr=document.getElementById('nores');
