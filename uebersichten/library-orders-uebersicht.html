const list = document.getElementById('list');
const q = document.getElementById('q');
const stat = document.getElementById('stat');

const OP = {LessThan:'&lt;', GreaterThan:'&gt;', AtLeast:'&ge;', AtMost:'&le;',
            Equals:'=', NotEqual:'&ne;'};

function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function spaceCase(s){return String(s||'').replace(/([a-z])([A-Z])/g,'$1 $2');}

DATA.forEach(f=>{
  let parts=[f.name];
  f.orders.forEach(o=>{
    parts.push(o.job, spaceCase(o.job), o.item_subtype, o.material, o.reaction);
    (o.material_category||[]).forEach(m=>parts.push(m));
    (o.item_conditions||[]).forEach(c=>{
      parts.push(c.item_type, c.item_subtype, c.material, c.tool, c.reaction_class, c.reaction_id);
      (c.flags||[]).forEach(x=>parts.push(x));
    });
  });
  f._text = parts.filter(Boolean).join(' ').toLowerCase();
});

function condHtml(c){
  let subj = c.item_type || c.tool || '?';
  let q2 = [];
  if(c.material) q2.push(c.material);
  if(c.item_subtype) q2.push(c.item_subtype);
  if(c.reaction_class) q2.push('class:'+c.reaction_class);
  if(c.flags && c.flags.length) q2.push(c.flags.join(','));
  let q2s = q2.length ? '('+esc(q2.join(' / '))+')' : '';
  let op = OP[c.condition]||esc(c.condition);
  return '<span class="cond">&bull; '+esc(subj)+q2s+' <span class="op">'+op+'</span> '+esc(c.value)+'</span>';
}

function orderRows(o){
  let mats=[];
  if(o.material) mats.push(o.material);
  (o.material_category||[]).forEach(m=>mats.push(m));
  if(o.item_subtype) mats.push(o.item_subtype);
  let matHtml = mats.length ? mats.map(m=>'<span class="pill">'+esc(m)+'</span>').join('') : '<span class="empty">&ndash;</span>';
  let conds = (o.item_conditions||[]);
  let condStr = conds.length ? conds.map(condHtml).join('') : '<span class="empty">keine</span>';
  let job = o.reaction ? esc(o.reaction) : esc(spaceCase(o.job));
  let rawJob = (o.job && o.job!==job) ? '<div class="raw">'+esc(o.job)+'</div>' : '';
  return '<tr><td class="job">'+job+rawJob+'</td><td>'+matHtml+'</td><td>'+esc(o.frequency)+'</td><td>'+esc(o.amount_total)+'</td><td>'+condStr+'</td></tr>';
}

function cardHtml(f){
  let rows = f.orders.length
    ? '<table><thead><tr><th>Auftrag</th><th>Material/Typ</th><th>Frequenz</th><th>Menge</th><th>Bedingungen (wann gefertigt)</th></tr></thead><tbody>'+f.orders.map(orderRows).join('')+'</tbody></table>'
    : '<div class="empty" style="padding:8px 0">leere Liste</div>';
  return '<div class="card" data-name="'+esc(f.name.toLowerCase())+'">'
    +'<div class="chead"><span class="arrow">&#9654;</span><span class="fname">'+esc(f.name)+'</span>'
    +'<span class="badge">'+f.orders.length+' Auftr'+(f.orders.length===1?'ag':'aege')+'</span></div>'
    +'<div class="cbody">'+rows+'</div></div>';
}

list.innerHTML = DATA.map(cardHtml).join('');

list.addEventListener('click', e=>{
  let h=e.target.closest('.chead'); if(!h) return;
  h.parentElement.classList.toggle('open');
});
document.getElementById('expandAll').onclick=()=>document.querySelectorAll('.card:not([hidden])').forEach(c=>c.classList.add('open'));
document.getElementById('collapseAll').onclick=()=>document.querySelectorAll('.card').forEach(c=>c.classList.remove('open'));

function update(){
  let term = q.value.trim().toLowerCase();
  let shown=0;
  DATA.forEach((f,i)=>{
    let card = list.children[i];
    let hit = !term || f._text.includes(term);
    card.hidden = !hit;
    if(hit){ shown++; if(term) card.classList.add('open'); else card.classList.remove('open'); }
  });
  stat.textContent = term ? (shown+' von '+DATA.length+' Listen passen')
    : (DATA.length+' Listen, '+DATA.reduce((a,f)=>a+f.orders.length,0)+' Auftraege gesamt');
  let nr=document.getElementById('nores');
  if(shown===0 && !nr){ let d=document.createElement('div'); d.id='nores'; d.className='nores'; d.textContent='Nichts gefunden.'; list.appendChild(d); }
  if(shown>0 && nr) nr.remove();
}
q.addEventListener('input', update);
update();
</script>
</body>
</html>
